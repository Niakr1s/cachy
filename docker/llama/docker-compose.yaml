services:
  llama-cpp-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    container_name: llama-cpp-server
    restart: unless-stopped
    ports:
      - "8001:8080"
    volumes:
      - ${MODELS_DIR}:/models
      - ./preset.ini:/preset.ini
    command: >
      --port 8080
      --host 0.0.0.0
      --models-preset /preset.ini
      --models-max 1
    # --sleep-idle-seconds 1800
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
