# General settings
set -g clock-mode-style 24
set -g history-limit 10000
set -g base-index 1
set -g escape-time 0

# Mode keys and mouse
setw -g mode-keys vi
set -g mouse on

# Change prefix to C-q
unbind C-b
set -g prefix C-q

# Plugin settings (if using TPM)
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Window/Pane management
bind v split-window -h -c "#{pane_current_path}"
bind c split-window -v -c "#{pane_current_path}"
bind t new-window -c "#{pane_current_path}"

# Window navigation
bind ] next-window
bind [ previous-window

# Copy mode
bind Space copy-mode

# Kill pane with confirmation
unbind x
bind q confirm-before -p "kill-pane #{pane_current_path} $ '#{pane_current_command}'? (y/n)" kill-pane
bind C-q confirm-before -p "kill-pane #{pane_current_path} $ '#{pane_current_command}'? (y/n)" kill-pane

# Display panes
bind w display-panes
bind C-w display-panes

# Resize panes with Alt+hjkl
bind -r M-h resize-pane -L 10
bind -r M-j resize-pane -D 10
bind -r M-k resize-pane -U 10
bind -r M-l resize-pane -R 10

# Status bar
set -g status-right "%H:%M:%S %d/%m/%Y"
set -g status-interval 1

# Terminal title
set -g set-titles on
set -g set-titles-string "#{pane_current_command}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
