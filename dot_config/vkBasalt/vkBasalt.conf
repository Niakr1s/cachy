# --- CORE SETTINGS ---
# Active effects (ordered from first applied to last)
# cas = Contrast Adaptive Sharpening | smaa = Anti-aliasing | deband = Smooth gradients
effects = dls:smaa

# In-game key to toggle all effects on/off (Default is Home)
toggleKey = Home

# --- CAS (CONTRAST ADAPTIVE SHARPENING) ---
# Perfect for cleaning up blurry textures or lower render resolutions (FSR/DLSS/Proton upscaling)
# Range: 0.0 (subtle) to 1.0 (sharp). 0.4 is the sweet spot to avoid visual noise/halos.
casSharpness = 0.6

# --- DLS (DENOISED LUMA SHARPENING) ---
# vkBasalt has a built-in Denoised Luma Sharpening (DLS) effect. It is specifically designed to sharpen details while limiting how much film grain/noise gets amplified
dlsSharpness = 0.6
dlsDenoise = 0.5

# --- SMAA (SUBTLE ANTI-ALIASING) ---
# High-quality edge smoothing. Superior to FXAA without creating a blurry image.
smaaQuality = ultra
smaaThreshold = 0.05

# Pattern search constraints for crisp edges (Ultra preset defaults)
smaaMaxSearchSteps = 32
smaaMaxSearchStepsDiag = 16
smaaCornerRounding = 25
