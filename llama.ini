version = 1

; --- Global settings applied to all models ---
; These values serve as a baseline. You can override them per-model if needed.
[*]
; Offload all layers to the GPU (if you have limited VRAM, lower this number)
n-gpu-layers = 999
; 256k by default
ctx-size = 262144
; parallel
np = 1
; Use the model's built-in Jinja chat template (recommended for modern models)
jinja = true
; Enable Flash Attention if supported by your GPU/backend for better performance
flash-attn = true
; Quantize KV cache to 8bit
cache-type-k = q8_0 ; must remain at q8_0
cache-type-v = q8_0 ; can be set to q4_0 if needed
; Enable unified KV cache
kv-unified = true
; Vision set to CPU
no-mmproj-offload = true
; Limit image cap
image-max-tokens = 1024
; Batch sizes
ubatch-size = 512
batch-size = 2048
; n-gram predictions
spec-type = ngram-mod
spec-ngram-mod-n-match = 24
spec-ngram-mod-n-min = 48 ; 48 for MoE, 16 for dense
spec-ngram-mod-n-max = 64 ; 64 for MoE, 32 for dense


; --- Qwen3.8-27B ---

[Qwen3.8-27B] ; 30t/s
model = HauhauCS/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-MTP-GGUF/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-IQ4_XS.gguf
mmproj = HauhauCS/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-MTP-GGUF/mmproj-Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-BF16.gguf

ctx-size = 131072
cache-type-v = q4_0

spec-type = draft-mtp
spec-draft-n-max = 1

chat-template-kwargs = {"reasoning_effort": "medium"}

spec-ngram-mod-n-min = 16
spec-ngram-mod-n-max = 32

temperature = 1.0
min-p = 0.00
top-p = 0.95
top-k = 20
repeat-penalty = 1.1
presence-penalty = 0.0


; --- Qwen3.6-35B-A3B ---

[Qwen3.6-35B-A3B] ; 80 t/s
model = mudler/Ornith-1.5-35B-A3B-APEX-MTP-GGUF/Ornith-1.5-35B-A3B-APEX-MTP-I-Compact.gguf
mmproj = mudler/Ornith-1.5-35B-A3B-APEX-MTP-GGUF/mmproj.gguf

ctx-size = 180000

spec-type = draft-mtp
spec-draft-n-max = 1

temperature = 1.0
min-p = 0.00
top-p = 0.95
top-k = 20
repeat-penalty = 1.1
presence-penalty = 0.0


; --- Gemma4-26B-A4B ---

[Gemma4-26B-A4B] ; 60 t/s
model = HauhauCS/Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-MTP/Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-Q4_K_M.gguf
mmproj = HauhauCS/Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-MTP/mmproj-Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-BF16.gguf

ctx-size = 177777
cache-type-v = q4_0

spec-type = draft-mtp
spec-draft-n-max = 1
model-draft = HauhauCS/Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-MTP/mtp-gemma-4-26B-A4B-it.gguf

temperature = 0.6
min-p = 0.05
top-p = 0.90
top-k = 64
repeat-penalty = 1.1


; --- Gemma4-E4B ---

[Gemma4-E4B] ; 60 t/s
model = HauhauCS/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive-Q5_K_P.gguf ; IQ4_XS.gguf
mmproj = HauhauCS/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive/mmproj-Gemma-4-E4B-Uncensored-HauhauCS-Aggressive-f16.gguf

ctx-size = 262144

temperature = 1.0
min-p = 0.05
top-p = 0.95
top-k = 64
repeat-penalty = 1.1
