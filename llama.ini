version = 1

; --- Global settings applied to all models ---
; These values serve as a baseline. You can override them per-model if needed.
[*]
; Offload all layers to the GPU (if you have limited VRAM, lower this number)
n-gpu-layers = 999
; 256k by default
ctx-size = 262144
; Use the model's built-in Jinja chat template (recommended for modern models)
jinja = true
; Enable Flash Attention if supported by your GPU/backend for better performance
flash-attn = true
; Quantize KV cache to 8bit
cache-type-k = q8_0
cache-type-v = q8_0
; Enable unified KV cache
kv-unified = true
; Vision set to CPU
no-mmproj-offload = true
; Limit image cap
image-max-tokens = 1024
; Batch sizes
ubatch-size = 512
batch-size = 2048

; --- Model-specific presets ---


; --- Qwen3.8-27B ---

[Qwen3.8-27B]
model = HauhauCS/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-MTP-GGUF/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-IQ4_XS.gguf
mmproj = HauhauCS/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-MTP-GGUF/mmproj-Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-BF16.gguf
ctx-size = 131072
chat-template-kwargs = {"reasoning_effort": "xhigh"}

temperature = 1.0
min-p = 0.00
top-p = 0.95
top-k = 20
repeat-penalty = 1.1
presence-penalty = 0.0


